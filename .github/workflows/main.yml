name: "Build kernels"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"

on:
  workflow_dispatch:

jobs:
  Set-repos:
    name: "🐂 Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "😄 Checkout"
        uses: actions/checkout@v4

      - name: "😆 Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          cat  ${{ env.CONFIGURATION }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐎 Build kernel"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.device }}_defconfig
      withKernelSU: ${{ matrix.repos.withKernelSU }}
    steps:
      - name: "✨ Create working dir"
        run: mkdir -p $kernelDir

      - name: "⭐ Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python2 python3 libarchive-tools jq

      - name: "🌟 Clone kernel source => (${{ env.kernelRepo }})"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch $kernelBranch $kernelRepo $kernelName --depth=1

      - name: "💫 Get toolchains"
        working-directory: ./${{ env.kernelDir }}
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          toolchains_num="$(echo $toolchains | jq 'length')"
          echo "Found $toolchains_num toolchains to sync"
          for ((i=0;i<toolchains_num;i++)); do
            name=$(echo $toolchains | jq -r ".[$i].name")
            repo=$(echo $toolchains | jq -r ".[$i].repo")
            branch=$(echo $toolchains | jq -r ".[$i].branch")
            git clone --recursive --branch $branch $repo $name --depth=1
            echo "$(pwd)/$name/bin" >> $GITHUB_PATH
            echo "$(pwd)/$name" >> $GITHUB_PATH
          done

      - name: "😎 Set args"
        id: generate-args
        working-directory: ./${{ env.kernelDir }}
        env:
          params: "${{ toJSON(matrix.repos.params) }}"
          extraParams: "${{ toJSON(matrix.repos.extraParams) }}"
        run: |
          # Read all variables cleanly from matrix params
          ARCH=$(echo $params | jq -r ".ARCH // empty")
          CROSS_COMPILE=$(echo $params | jq -r ".CROSS_COMPILE // empty")
          CROSS_COMPILE_ARM32=$(echo $params | jq -r ".CROSS_COMPILE_ARM32 // empty")
          CLANG_TRIPLE=$(echo $params | jq -r ".CLANG_TRIPLE // empty")
          AR=$(echo $params | jq -r ".AR // empty")
          CC=$(echo $params | jq -r ".CC // empty")
          NM=$(echo $params | jq -r ".NM // empty")
          OBJCOPY=$(echo $params | jq -r ".OBJCOPY // empty")
          OBJDUMP=$(echo $params | jq -r ".OBJDUMP // empty")
          STRIP=$(echo $params | jq -r ".STRIP // empty")

          # Write runtime architecture directly to environment map
          if [ -n "$ARCH" ]; then
            echo "ARCH=$ARCH" >> $GITHUB_ENV
          fi

          # Construct parameters array
          args="-j$(nproc --all)"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p "$(pwd)/${{ env.OUT_DIR }}"
            args="$args O=$(pwd)/${{ env.OUT_DIR }}"
          fi
          
          [ -n "$ARCH" ] && args="$args ARCH=$ARCH"
          [ -n "$CC" ] && args="$args CC=$CC"
          [ -n "$CROSS_COMPILE" ] && args="$args CROSS_COMPILE=$CROSS_COMPILE"
          [ -n "$CLANG_TRIPLE" ] && args="$args CLANG_TRIPLE=$CLANG_TRIPLE"
          
          # Handle legacy and modern variant properties for 32-bit compat headers
          if [ -n "$CROSS_COMPILE_ARM32" ]; then
            args="$args CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 CROSS_COMPILE_COMPAT=$CROSS_COMPILE_ARM32"
          fi
          
          # Add bundled LLVM tool configurations if parsed
          [ -n "$AR" ] && args="$args AR=$AR"
          [ -n "$NM" ] && args="$args NM=$NM"
          [ -n "$OBJCOPY" ] && args="$args OBJCOPY=$OBJCOPY"
          [ -n "$OBJDUMP" ] && args="$args OBJDUMP=$OBJDUMP"
          [ -n "$STRIP" ] && args="$args STRIP=$STRIP"
          
          # Crucial fallback for Clang building Android 4.9 source structures
          if [ "$CC" = "clang" ]; then
            args="$args LD=ld.lld"
          fi

          # Filter and clean extra key-value inputs safely
          extra_params=$(echo $extraParams | jq -r 'to_entries[] | select(.value != "") | "\(.key)=\(.value)"' | tr "\n" " " | sed 's/ $//')
          
          if [ -n "$extra_params" ]; then
            final_args="$args $extra_params"
          else
            final_args="$args"
          fi

          echo "Final build arguments: $final_args"
          echo "args=$final_args" >> $GITHUB_OUTPUT

      - name: "😋 Update KernelSU"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        if: ${{ env.withKernelSU == 'true' || matrix.repos.withKernelSU == true }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu
          
          # Samsung MSM8953/SDM450/SDM429 4.9 branches require old version hooks
          curl -LSs "https://githubusercontent.com" | bash -s v0.9.5

          TARGET_ARCH="${{ env.ARCH }}"
          [ -z "$TARGET_ARCH" ] && TARGET_ARCH=$(echo '${{ toJSON(matrix.repos.params) }}' | jq -r '.ARCH')

          echo "CONFIG_KPROBES=y" >> ./arch/${TARGET_ARCH}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_HAVE_KPROBES=y" >> ./arch/${TARGET_ARCH}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KPROBE_EVENTS=y" >> ./arch/${TARGET_ARCH}/configs/${{ env.DEFCONFIG_NAME }}

      - name: "👍 Make defconfig"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          make ${{ steps.generate-args.outputs.args }} ${{ env.DEFCONFIG_NAME }}

      - name: "🏴‍☠️ Before Action"
        working-directory: ./${{ env.kernelDir }}
        run: |
          TARGET_CONFIG="./${{ env.OUT_DIR }}/.config"
          if [ -f "$TARGET_CONFIG" ]; then
            echo "CONFIG_OF_CONFIGFS=y" >> $TARGET_CONFIG
            echo "CONFIG_OF_OVERLAY=y" >> $TARGET_CONFIG
          else
            echo "Error: .config generation was bypassed. Verify defconfig name matching targets."
            exit 1
          fi
          
      - name: "🎶 Build kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          make ${{ steps.generate-args.outputs.args }}

      - name: "🏴‍☠️ Post Action"
        working-directory: ./${{ env.kernelDir }}
        run: |
          TARGET_ARCH="${{ env.ARCH }}"
          [ -z "$TARGET_ARCH" ] && TARGET_ARCH=$(echo '${{ toJSON(matrix.repos.params) }}' | jq -r '.ARCH')
          find "./${{ env.OUT_DIR }}/arch/${TARGET_ARCH}/" -type f 2>/dev/null || true

      - name: "💛 Upload Build Deliverables"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-payload-${{ env.kernelDevice }}
          path: |
            ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/*/boot/Image
            ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/*/boot/Image.gz
            ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/*/boot/dtb
            ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/*/boot/dtbo.img
          if-no-files-found: ignore
          retention-days: 7
